<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baccara Control Room</title>
  <meta name="description" content="Pilotage des stratégies Baccarat, analyse IA et routage Telegram.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b12; --surface: #101622; --surface-2: #151d2b; --line: #243042;
      --text: #f4f7fb; --muted: #8e9bb0; --soft: #cbd5e1;
      --cyan: #70e1e5; --cyan-2: #1b9fa9; --orange: #f5b86b; --green: #75dfae;
      --red: #ff8390; --violet: #b7a2ff; --shadow: 0 24px 70px rgba(0,0,0,.28);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body { margin: 0; color: var(--text); background:
      radial-gradient(circle at 12% -10%, rgba(112,225,229,.13), transparent 35rem),
      radial-gradient(circle at 92% 0%, rgba(245,184,107,.10), transparent 28rem), var(--bg);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .mono, code, pre { font-family: "DM Mono", monospace; }
    .shell { max-width: 1220px; margin: auto; padding: 0 24px 72px; }
    header { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(36,48,66,.75);
      background: rgba(8,11,18,.82); backdrop-filter: blur(18px); }
    .topbar { max-width: 1220px; margin: auto; padding: 17px 24px; display: flex; gap: 28px; align-items: center; }
    .brand { display: flex; gap: 12px; align-items: center; font-weight: 800; letter-spacing: -.04em; }
    .mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
      color: #071014; background: linear-gradient(145deg, var(--cyan), var(--orange)); box-shadow: 0 8px 24px rgba(112,225,229,.18); }
    .brand small { display: block; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    nav { display: none; }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; padding: 34px 0 60px; }
    .logout-home-btn {
      display: block; width: 100%; margin-top: 22px; padding: 16px 20px;
      background: #e21c34; color: #fff; border: 3px solid #000; border-radius: 14px;
      font-size: 17px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px;
      cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,.45);
    }
    .logout-home-btn:hover { background: #ff2d47; transform: translateY(-2px); }
    .home-button { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; text-align: left;
      background: #FFD400; color: #000; border: 3px solid #000; border-radius: 16px; padding: 26px 22px;
      font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px; cursor: pointer;
      box-shadow: 0 8px 0 rgba(0,0,0,.45); }
    .home-button:hover { background: #FFE45C; transform: translateY(-2px); }
    .home-button small { color: #000; font-size: 14px; font-weight: 800; text-transform: none; }
    .backbar { padding: 26px 0 8px; }
    .home-back { background: #FFD400; color: #000; border: 3px solid #000; font-weight: 900; font-size: 16px;
      border-radius: 12px; padding: 12px 18px; text-transform: uppercase; text-decoration: none; display: inline-block; }
    .home-back:hover { background: #FFE45C; }
    nav a { color: var(--muted); text-decoration: none; border: 1px solid transparent; padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; }
    nav a:hover, nav a.active { color: var(--text); background: var(--surface-2); border-color: var(--line); }
    .status { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .status.ok i { background: var(--green); box-shadow: 0 0 0 5px rgba(117,223,174,.1); }
    .readonly-badge { color: var(--orange); }
    .readonly-badge i { background: var(--orange); box-shadow: 0 0 0 5px rgba(245,184,107,.12); }
    button.readonly-locked, button.readonly-locked:hover { opacity: .4; cursor: not-allowed; transform: none; }
    .eyebrow { color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 730px; margin: 16px 0 14px; font-size: clamp(34px, 6vw, 68px); line-height: .98; letter-spacing: -.065em; }
    h2 { font-size: 24px; letter-spacing: -.045em; margin-bottom: 18px; }
    h3 { font-size: 16px; letter-spacing: -.025em; margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.7; }
    .hero { padding: 68px 0 40px; display: grid; grid-template-columns: 1.5fr .8fr; gap: 38px; align-items: end; }
    .hero p { max-width: 670px; font-size: 15px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 44px; padding: 0 16px;
      border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: var(--surface-2); font-weight: 800; font-size: 13px; transition: .18s ease; }
    .button:hover { transform: translateY(-1px); border-color: #49627f; }
    .button.primary { color: #071014; border-color: transparent; background: linear-gradient(135deg, var(--cyan), #b5f2d5); }
    .button.orange { color: #1a1006; border-color: transparent; background: linear-gradient(135deg, var(--orange), #ffd9a4); }
    .button.ghost { background: transparent; }
    .button.danger { color: var(--red); border-color: rgba(255,131,144,.32); background: rgba(255,131,144,.06); }
    .button.small { min-height: 34px; padding: 0 11px; font-size: 11px; border-radius: 9px; }
    .panel { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, rgba(21,29,43,.94), rgba(13,18,28,.94)); box-shadow: var(--shadow); }
    .pulse-card { padding: 20px; border: 1px solid rgba(112,225,229,.25); border-radius: var(--radius); background: linear-gradient(145deg, rgba(19,48,55,.62), rgba(16,22,34,.75)); }
    .live-number { margin: 15px 0 4px; color: var(--cyan); font-size: 42px; font-weight: 800; letter-spacing: -.08em; }
    .live-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px; color: var(--soft); background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 11px; font-weight: 700; }
    .tag.good { color: var(--green); border-color: rgba(117,223,174,.28); background: rgba(117,223,174,.08); }
    .tag.warn { color: var(--orange); border-color: rgba(245,184,107,.28); background: rgba(245,184,107,.08); }
    .tag.bad { color: var(--red); border-color: rgba(255,131,144,.28); background: rgba(255,131,144,.08); }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 42px; }
    .stat { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: rgba(16,22,34,.76); }
    .stat b { display: block; margin-top: 8px; font-size: 27px; letter-spacing: -.06em; }
    .stat span { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .strategy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); gap: 12px; }
    .panel { background: rgba(255,255,255,.04); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .panel h3 { margin: 0 0 10px; font-size: 15px; }
    .deploy-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; border-radius: 8px; cursor: pointer; }
    .deploy-row:hover { background: rgba(255,255,255,.05); }
    .deploy-row input { margin-top: 4px; }
    .deploy-row span { display: flex; flex-direction: column; gap: 2px; }
    .deploy-row small { opacity: .65; font-size: 12px; }
    .strategy-button { min-height: 112px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; padding: 18px;
      border: 1px solid var(--line); border-radius: 17px; color: var(--text); background: var(--surface); transition: .2s; }
    .strategy-button:hover { border-color: var(--cyan); background: #15232c; transform: translateY(-2px); }
    .strategy-button b { font-size: 14px; }
    .strategy-button span { color: var(--muted); font-size: 11px; line-height: 1.4; }
    .strategy-button em { color: var(--cyan); font-size: 11px; font-style: normal; }
    .section { margin-top: 44px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .section-head p { margin: 0; font-size: 12px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field label { color: var(--soft); font-size: 12px; font-weight: 700; }
    input, select, textarea { width: 100%; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none; background: #0b111b; }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(112,225,229,.09); }
    textarea { min-height: 112px; resize: vertical; line-height: 1.55; }
    .check { display: flex; align-items: center; gap: 9px; color: var(--soft); font-size: 12px; }
    .check input { width: auto; accent-color: var(--cyan); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    .notice { padding: 13px 15px; margin: 14px 0; border-radius: 12px; color: var(--soft); background: rgba(112,225,229,.06); border: 1px solid rgba(112,225,229,.18); font-size: 12px; line-height: 1.55; }
    .notice.warn { border-color: rgba(245,184,107,.28); background: rgba(245,184,107,.06); }
    .notice.error { border-color: rgba(255,131,144,.28); background: rgba(255,131,144,.06); }
    .ai-qa-entry { padding: 18px 20px; margin: 14px 0; border-radius: 14px; background: #ffffff; border: 1px solid #dbe2ec; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
    .ai-qa-entry .ai-qa-question { color: #0b3d91; font-size: 17px; font-weight: 700; line-height: 1.4; }
    .ai-qa-entry .ai-qa-text { margin-top: 10px; color: #10161f; font-size: 17px; line-height: 1.65; white-space: pre-wrap; }
    .ai-qa-entry .ai-qa-meta { margin-top: 10px; color: #55617a; font-size: 12.5px; }
    .route-card { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: rgba(8,11,18,.34); }
    .route-card.public { border-color: rgba(117,223,174,.25); }
    .route-card.shadow { border-color: rgba(183,162,255,.28); }
    .route-title { display: flex; gap: 9px; align-items: center; margin-bottom: 4px; }
    .route-title strong { font-size: 14px; }
    .route-title i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .shadow .route-title i { background: var(--violet); }
    .route-card p { margin-bottom: 14px; font-size: 11px; }
    .split { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .back { margin-bottom: 16px; }
    .back a { color: var(--muted); font-size: 12px; text-decoration: none; }
    .back a:hover { color: var(--cyan); }
    .proposals { display: grid; gap: 12px; margin-top: 18px; }
    .proposal { padding: 18px; border: 1px solid rgba(183,162,255,.25); border-radius: 15px; background: rgba(183,162,255,.055); }
    .proposal h3 { color: #d8d0ff; }
    .proposal dl { display: grid; grid-template-columns: 130px 1fr; gap: 8px; font-size: 12px; }
    .proposal dt { color: var(--muted); font-weight: 700; }
    .proposal dd { margin: 0; color: var(--soft); line-height: 1.5; }
    .format-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 10px; }
    .format-card { min-height: 142px; padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .format-card b { color: var(--orange); font-size: 12px; }
    .format-card pre { white-space: pre-wrap; color: var(--soft); font-size: 11px; line-height: 1.55; margin: 12px 0 0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 11px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px;
      background: rgba(4,7,12,.72); backdrop-filter: blur(8px); animation: fade .18s ease; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985) } to { opacity: 1; transform: none } }
    .modal { width: min(560px, 100%); max-height: 86vh; overflow: auto; padding: 26px; border-radius: 22px;
      border: 1px solid rgba(112,225,229,.28); background: linear-gradient(150deg, rgba(22,33,47,.98), rgba(11,16,25,.98));
      box-shadow: 0 40px 110px rgba(0,0,0,.55); animation: rise .22s ease; }
    .modal h3 { font-size: 20px; letter-spacing: -.04em; margin-bottom: 4px; }
    .modal dl { display: grid; grid-template-columns: 150px 1fr; gap: 10px 14px; margin: 20px 0 0; font-size: 13px; }
    .modal dt { color: var(--muted); font-weight: 700; }
    .modal dd { margin: 0; color: var(--soft); word-break: break-all; }
    .modal-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 24px; }
    .modal-head { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
    .empty { padding: 36px 20px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 14px; }
    .loading { min-height: 160px; display: grid; place-items: center; color: var(--muted); }
    footer { margin-top: 50px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    @media (max-width: 820px) {
      .topbar { gap: 14px; flex-wrap: wrap; } nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; }
      .hero, .two-col { grid-template-columns: 1fr; } .stat-grid { grid-template-columns: repeat(2,1fr); }
      .three-col { grid-template-columns: 1fr; } .shell { padding: 0 15px 52px; } .hero { padding-top: 40px; }
    }
    /* ── Écran de démarrage (barre orange puis image), avant le tableau de bord ── */
    #splash {
      position: fixed; inset: 0; z-index: 999;
      background: #05070d;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #splash.leaving { animation: splashOut 700ms ease forwards; }
    #loadStage { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 240px; transition: opacity 350ms ease; }
    #loadStage.hidden-stage { opacity: 0; pointer-events: none; position: absolute; }
    .bar-track { width: 100%; height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #ff7a00, #ffb347); box-shadow: 0 0 14px rgba(255,138,0,.6); }
    .bar-fill.done { background: linear-gradient(90deg, #35e08a, #6bf0ac); box-shadow: 0 0 14px rgba(53,224,138,.55); }
    #loadPct { font-size: 15px; color: #cfd4e2; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
    #loadLabel { font-size: 12px; color: #7c8398; letter-spacing: .05em; text-transform: uppercase; }
    #imgStage { position: absolute; inset: 0; opacity: 0; transition: opacity 500ms ease; }
    #imgStage.visible { opacity: 1; }
    #imgStage img { width: 100%; height: 100%; object-fit: cover; animation: splashZoom 2600ms ease-out forwards; }
    #imgStage .tap { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; color: #cfd4e2; font-size: 12px; letter-spacing: .04em; opacity: 0; animation: tapFade 900ms ease forwards; animation-delay: 500ms; }
    @keyframes splashZoom { 0% { transform: scale(1.08); filter: brightness(.55) saturate(1.05); } 60% { transform: scale(1.02); filter: brightness(1) saturate(1.05); } 100% { transform: scale(1); filter: brightness(1) saturate(1.05); } }
    @keyframes tapFade { from { opacity: 0; } to { opacity: .75; } }
    @keyframes splashOut { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    body.no-scroll { overflow: hidden; }
  </style>
</head>
<body class="no-scroll">
  <div id="splash" onclick="closeSplash()">
    <div id="loadStage">
      <div class="bar-track"><div class="bar-fill" id="barFillEl"></div></div>
      <div id="loadPct">0 %</div>
      <div id="loadLabel">Téléchargement…</div>
    </div>
    <div id="imgStage">
      <img src="/splash.jpg" alt="1XBET + Baccara + IA">
      <div class="tap">Touchez pour continuer</div>
    </div>
  </div>
  <header>
    <div class="topbar">
      <a class="brand" href="#/" style="text-decoration:none">
        <span class="mark">B</span><span>Baccara Control Room<small>Prediction operations</small></span>
      </a>
      <nav>
        <a href="#/" data-nav="home">Accueil</a>
        <a href="#/strategies" data-nav="strategies">Stratégies</a>
        <a href="#/ai" data-nav="ai">Analyseur IA</a>
        <a href="#/ai-strategies" data-nav="ai">Stratégies IA</a>
        <a href="#/predit" data-nav="predit">Prédit</a>
        <a href="#/after-loss" data-nav="after-loss">Après perte</a>
        <a href="#/diagnostics" data-nav="settings">Envois</a>
        <a href="#/database" data-nav="database">Base de données</a>
        <a href="#/formats" data-nav="formats">Formats</a>
        <a href="#/settings" data-nav="settings">Configuration</a>
      </nav>
      <span id="botStatus" class="status"><i></i> Connexion...</span>
      <span id="roleBadge" class="status readonly-badge" style="display:none"><i></i> Lecture seule</span>
    </div>
  </header>
  <main id="app" class="shell"><div class="loading">Chargement du centre de contrôle...</div></main>
  <script>
    // écran de démarrage : barre orange 0→100 %, puis image, puis fermeture
    // (dès que l'animation ET le premier chargement des données sont finis).
    let firstRouteDone = false;
    function closeSplash() {
      const s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('leaving');
      s.addEventListener('animationend', function done(e) {
        if (e.animationName !== 'splashOut') return;
        s.removeEventListener('animationend', done);
        s.style.display = 'none';
      });
      document.body.classList.remove('no-scroll');
    }
    (function () {
      const s = document.getElementById('splash');
      if (!s) return;
      const pctEl = document.getElementById('loadPct');
      const labelEl = document.getElementById('loadLabel');
      const barFillEl = document.getElementById('barFillEl');
      const loadStage = document.getElementById('loadStage');
      const imgStage = document.getElementById('imgStage');
      const DURATION = 1600;
      const start = performance.now();
      function reveal() {
        loadStage.classList.add('hidden-stage');
        imgStage.classList.add('visible');
        setTimeout(closeSplash, 2600);
      }
      function tick(now) {
        const pct = Math.min(100, Math.round(((now - start) / DURATION) * 100));
        pctEl.textContent = pct + ' %';
        barFillEl.style.width = pct + '%';
        if (pct < 100) {
          requestAnimationFrame(tick);
        } else {
          barFillEl.classList.add('done');
          labelEl.textContent = 'Terminé ✓';
          // on attend que le premier chargement des données du tableau de bord
          // soit fini avant de révéler l'image, pour ne rien montrer de cassé
          if (firstRouteDone) setTimeout(reveal, 300);
          else { const wait = setInterval(() => { if (firstRouteDone) { clearInterval(wait); reveal(); } }, 120); }
        }
      }
      requestAnimationFrame(tick);
      setTimeout(closeSplash, 8000); // filet de sécurité
    })();

    let snapshot = null;
    const $ = (s, root = document) => root.querySelector(s);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const ids = (value) => String(value || '').split(/[\s,;]+/).map(x => x.trim()).filter(Boolean);
    const formatDate = (value) => value ? new Date(value).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' }) : '—';
    async function api(url, method = 'GET', body, timeoutMs) {
      // CORRECTIF (page /ai qui semblait « plantée ») : sans timeout côté
      // navigateur, un appel lent (ex. analyse IA qui essaie plusieurs
      // fournisseurs) laissait la page figée indéfiniment, sans aucun
      // message d'erreur. Un timeout optionnel permet d'abandonner
      // proprement avec un message clair au lieu d'un gel silencieux.
      const controller = timeoutMs ? new AbortController() : null;
      const timer = timeoutMs ? setTimeout(() => controller.abort(), timeoutMs) : null;
      let res;
      try {
        res = await fetch(url, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined, signal: controller ? controller.signal : undefined });
      } catch (e) {
        if (e.name === 'AbortError') throw new Error("L'analyse IA a pris trop de temps (délai dépassé) : réessayez, ou vérifiez la clé/le fournisseur configuré.");
        throw e;
      } finally {
        if (timer) clearTimeout(timer);
      }
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        // session coupée (non connecté, ou temps d'accès accordé par l'admin écoulé)
        const qs = data.blocked ? `?blocked=1&telegram=${encodeURIComponent(data.telegram || '')}` : '';
        window.location.href = '/login.html' + qs;
        throw new Error(data.error || 'Session expirée.');
      }
      if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
      return data;
    }
    function toast(message, type = '') {

    async function generateDeployZip() {
      const boxes = [...document.querySelectorAll('.deploySel:checked')].map((b) => b.value);
      if (!boxes.length) return toast('Sélectionne au moins une stratégie.', 'error');
      const selection = boxes.map((v) => {
        const [type, ref] = v.split(':');
        return type === 'ai' ? { type: 'ai', id: ref } : { type: 'base', key: ref };
      });
      const btn = $('#deployGenBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Génération…'; }
      try {
        const res = await fetch('/api/deploy/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selection }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `Erreur ${res.status}`);
        }
        const blob = await res.blob();
        const cd = res.headers.get('Content-Disposition') || '';
        const m = cd.match(/filename="([^"]+)"/);
        const filename = m ? m[1] : 'baccara-bot-deploy.zip';
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; document.body.appendChild(a); a.click();
        a.remove(); URL.revokeObjectURL(url);

    function ordinalFr(n) { return n === 1 ? '1ʳᵉ' : `${n}ᵉ`; }
    async function announcementsPage() {
      setNav('announcements'); $('#app').innerHTML = '<div class="loading">Chargement des annonces…</div>';
      try {
        const [r, preds] = await Promise.all([
          api('/api/ombre/announcements?limit=30'),
          api('/api/predictions?limit=150'),
        ]);
        const list = r.items || [];
        const pending = list.filter(a => a.status === 'en_attente').length;
        const rows = list.length ? list.map(a => `<div class="panel" style="margin-bottom:10px">
          <div class="split"><b>Jeu perdu #N${esc(a.refNumber)} → position ${esc(ordinalFr(a.position))}</b>
          <span class="tag ${a.status === 'envoyee' ? 'good' : 'warn'}">${a.status === 'envoyee' ? '✅ Envoyée' : '⌛ En attente'}</span></div>
          <p class="small muted">${a.status === 'envoyee' ? `Envoyée sur #N${esc(a.sentNumber)} · ${formatDate(a.sentAt)}` : `Annoncée le ${formatDate(a.createdAt)} — décompte silencieux en cours`}</p></div>`).join('')
          : '<div class="empty">Aucune annonce pour l\'instant.</div>';
        // CORRECTIF (visibilité demandée) : tableau complet de TOUTES les
        // prédictions « ombre » (silencieuses ET publiques), pour voir d'un
        // coup d'œil sur le site ce qui a été calculé en silence et ce qui a
        // réellement été envoyé au canal public — sans avoir à ouvrir Telegram.
        const ombre = (preds.byStrategy && preds.byStrategy.ombre) || { silent: [], published: [] };
        const allOmbre = [...ombre.silent, ...ombre.published]
          .sort((a, b) => (b.target || 0) - (a.target || 0));
        const statusTag = (p) => `<span class="tag ${p.status === 'gagné' ? 'good' : p.status === 'perdu' ? 'bad' : 'warn'}">${esc(p.status)}</span>`;
        const diffusionTag = (p) => p.published
          ? `<span class="tag good">✅ Envoyée au public</span>`
          : `<span class="tag warn">🤫 Silencieuse${p.channels && p.channels.length ? '' : ' (pas encore envoyée)'}</span>`;
        const ombreTable = allOmbre.length
          ? `<table><thead><tr><th>Tour</th><th>Prédiction</th><th>Statut</th><th>Rattrapage</th><th>Diffusion</th><th>Créée le</th></tr></thead><tbody>${allOmbre.map(p => `<tr>
              <td class="mono">#N${esc(p.target)}</td>
              <td>${esc(p.label || p.suit || '')}</td>
              <td>${statusTag(p)}</td>
              <td class="mono">${esc(p.step ?? 0)}/${esc(p.maxR ?? 0)}</td>
              <td>${diffusionTag(p)}</td>
              <td class="small muted">${formatDate(p.createdAt)}</td>
            </tr>`).join('')}</tbody></table>`
          : '<div class="empty">Aucune prédiction « ombre » pour l\'instant.</div>';
        // CORRECTIF (demande : voir la file d'attente elle-même) : la file
        // d'attente ne contient pas des prédictions au sens strict — ce sont
        // des POSITIONS déjà confirmées (perte de référence → perte suivante
        // = écart N) qui patientent leur tour d'être réellement envoyées.
        // Ex. perte #N891 (référence) → perte #N895 (confirme, écart 4) :
        // la position N=4 rejoint la file, ET #N895 devient AUTOMATIQUEMENT
        // la nouvelle référence pour mesurer la position suivante — sans
        // jamais interrompre la file déjà en cours.
        const queue = (r.gate && r.gate.queue) || [];
        const queueTable = queue.length
          ? `<table><thead><tr><th>Ordre</th><th>Référence (perte confirmante)</th><th>Position à envoyer</th><th>Progression</th><th>État</th></tr></thead><tbody>${queue.map((q, i) => `<tr>
              <td class="mono">${i + 1}${i === 0 ? ' (prochaine)' : ''}</td>
              <td class="mono">${q.refNumber != null ? '#N' + esc(q.refNumber) : '—'}</td>
              <td class="mono">N = ${esc(q.position)}</td>
              <td class="mono">${esc(q.seen)}/${esc(Math.max(1, q.position) - 1)}</td>
              <td>${q.ready ? '<span class="tag good">✅ Prête — sera envoyée au prochain tour</span>' : '<span class="tag warn">⌛ Décompte silencieux en cours</span>'}</td>
            </tr>`).join('')}</tbody></table>`
          : '<div class="empty">Aucune position en file d\'attente pour l\'instant.</div>';
        $('#app').innerHTML = `<div class="section-head" style="padding-top:38px"><div><span class="eyebrow">Prédiction dans l'ombre</span><h2 style="margin-top:7px">Annonces de position</h2><p class="small">Historique des confirmations (phase 2 → 3) : position annoncée, puis prédiction réellement envoyée au canal public une fois la phase 3 activée.</p></div><button class="button small ghost" onclick="announcementsPage()">Actualiser</button></div>
        <div class="notice ${r.gate?.armed ? '' : 'warn'}">${r.gate?.label || 'État du filtre indisponible'}</div>
        ${rows}
        ${list.length ? `<p class="small muted">${list.length} affichée(s) · ${pending} en attente</p>` : ''}
        <section class="section"><div class="section-head"><div><span class="eyebrow">File d'attente</span><h2 style="margin-top:7px">Positions confirmées en attente d'envoi</h2><p class="small">Chaque ligne est une position déjà confirmée (écart mesuré entre deux pertes) qui patiente son tour. La première de la liste part en premier ; dès qu'une perte confirme une nouvelle position pendant que d'autres patientent déjà, elle rejoint la file sans rien interrompre.</p></div></div>
        <div class="panel">${queueTable}</div></section>
        <section class="section"><div class="section-head"><div><span class="eyebrow">Vue d'ensemble</span><h2 style="margin-top:7px">Toutes les prédictions « ombre »</h2><p class="small">Chaque prédiction calculée en silence, avec sa colonne « Diffusion » qui indique si elle est restée silencieuse ou si elle a réellement été envoyée au canal public.</p></div></div>
        <div class="panel">${ombreTable}</div>
        ${allOmbre.length ? `<p class="small muted">${allOmbre.length} affichée(s) · ${allOmbre.filter(p => p.published).length} envoyée(s) au public · ${allOmbre.filter(p => !p.published).length} restée(s) silencieuse(s)</p>` : ''}</section>`;
      } catch(e) { $('#app').innerHTML = `<div class="notice error">${esc(e.message)}</div>`; }
    }

    function filterFormats() { const q = val('formatSearch').toLowerCase(); document.querySelectorAll('.format-card').forEach(c => c.style.display = c.dataset.search.includes(q) ? '' : 'none'); }
    function settingsPage() { setNav('settings'); const bot = snapshot.bot || {}, db = snapshot.db || {}; $('#app').innerHTML = `<div class="section-head" style="padding-top:38px"><div><span class="eyebrow">Système</span><h2 style="margin-top:7px">Configuration générale</h2><p class="small">Les réglages de chaque stratégie restent dans sa propre fiche.</p></div></div><div class="two-col"><div class="panel"><h3>Bot Telegram</h3><div class="notice ${bot.tokenSet ? '' : 'warn'}">${bot.tokenSet ? `Token enregistré : ${esc(bot.tokenMasked || 'masqué')}` : 'Aucun token Telegram configuré.'}</div><div class="field"><label>Token du bot</label><input id="botToken" type="password" autocomplete="off" placeholder="Coller le token Telegram pour le remplacer"></div><div class="field"><label>ID administrateur</label><input id="adminId" type="number" value="${esc(bot.adminId || '')}"></div><div class="field"><label>ID du canal principal</label><input id="mainChannel" placeholder="-1001234567890 ou @moncanal" value="${esc((snapshot.channels || []).filter(c => c.active).map(c => c.id).join(', '))}"></div><div class="toolbar"><button class="button primary" onclick="saveBot()">Enregistrer et redémarrer</button><button class="button orange" onclick="saveMainChannel()">Vérifier le canal et envoyer un message</button></div><div id="settingsMessage"></div></div><div class="panel"><h3>Base de données</h3><div class="notice ${db.ready ? '' : 'warn'}">${db.ready ? 'PostgreSQL connectée et prête.' : 'Base non connectée : le bot peut fonctionner avec l’historique en mémoire.'}</div><div class="field"><label>DATABASE_URL (optionnel)</label><input id="dbUrl" type="password" autocomplete="off" placeholder="URL PostgreSQL Render"></div><button class="button ghost" onclick="saveDb()">Connecter la base</button><p class="small" style="margin-top:15px">Sur Render, préfère la variable d’environnement <code>DATABASE_URL</code>.</p></div></div><div class="section"><div class="panel"><h3>Sécurité — accès au tableau de bord</h3><div class="notice ${snapshot.mail && snapshot.mail.configured ? '' : 'warn'}">${snapshot.mail && snapshot.mail.configured ? `Envoi des codes via Brevo, expéditeur : ${esc(snapshot.mail.from || '(non défini)')}` : "Aucune clé API Brevo configurée pour l'envoi des codes de confirmation."}</div><div class="field"><label>Clé API Brevo</label><input id="mailApiKey" type="password" autocomplete="off" placeholder="xkeysib-xxxxxxxxxxxxxxxx"></div><div class="field"><label>Adresse expéditrice</label><input id="mailFrom" type="text" autocomplete="off" placeholder="Baccara Bot <votre.adresse@gmail.com>"></div><div class="toolbar"><button class="button primary" onclick="saveMailConfig()">Enregistrer (une seule fois)</button><button class="button ghost" onclick="doLogout()">Se déconnecter</button></div><p class="small" style="margin-top:15px">Créez une clé API gratuite sur <a href="https://app.brevo.com/settings/keys/api" target="_blank" rel="noopener">app.brevo.com (Settings &gt; SMTP &amp; API)</a>. Contrairement à Resend, aucun domaine à vérifier : validez simplement l'adresse expéditrice une fois dans Brevo (Settings &gt; Senders) — un compte Gmail existant convient. Une fois validée, elle peut envoyer vers n'importe quelle adresse Gmail destinataire.</p><div id="mailMessage"></div></div></div><div class="section"><div class="panel"><h3>Réglages globaux historiques</h3><div class="three-col"><div class="field"><label>Compteur B</label><input id="globalB" type="number" min="1" value="${snapshot.b}"></div><div class="field"><label>Rattrapages</label><input id="globalR" type="number" min="0" max="9" value="${snapshot.maxR}"></div><div class="field"><label>Format par défaut</label><input id="globalF" type="number" min="1" max="${snapshot.formatCount}" value="${snapshot.format}"></div></div><button class="button primary" onclick="saveGlobals()">Enregistrer les réglages globaux</button>  </div></div>`; }
    async function saveBot() { try { if (val('botToken')) await api('/api/bot/token', 'POST', { token: val('botToken') }); await api('/api/bot/admin', 'POST', { adminId: val('adminId') }); await refresh(); settingsPage(); toast('Configuration Telegram enregistrée.'); } catch(e) { toast(e.message, 'error'); } }
    async function saveMainChannel() {
      const box = $('#settingsMessage');
      try {
        const r = await api('/api/channels/main', 'POST', { channelId: val('mainChannel') });
        await refresh(); settingsPage();
        toast(`Canal ${r.chat?.title || r.id} configuré : message de confirmation envoyé.`);
      } catch (e) { if (box) box.innerHTML = `<div class="notice error">${esc(e.message)}</div>`; toast(e.message, 'error'); }
    }
    async function saveDb() { try { await api('/api/db', 'POST', { url: val('dbUrl') }); await refresh(); settingsPage(); toast('Base connectée.'); } catch(e) { toast(e.message, 'error'); } }
    async function saveMailConfig() { try { await api('/api/auth/mail-config', 'POST', { apiKey: val('mailApiKey'), from: val('mailFrom') }); await refresh(); settingsPage(); toast("Clé Brevo enregistrée."); } catch(e) { toast(e.message, 'error'); } }
    async function doLogout() { try { await api('/api/auth/logout', 'POST', {}); } catch(e) {} window.location.href = '/login.html'; }
    async function saveGlobals() { try { await api('/api/setb', 'POST', { b: val('globalB') }); await api('/api/setmaxr', 'POST', { maxR: val('globalR') }); await api('/api/setformat', 'POST', { format: val('globalF') }); await refresh(); settingsPage(); toast('Réglages globaux enregistrés.'); } catch(e) { toast(e.message, 'error'); } }
    function injectBack() {
      const app = $('#app');
      if (!app) return;
      if (!location.hash || location.hash === '#/' || location.hash === '#') return;
      if (app.querySelector('.backbar')) return;
      const bar = document.createElement('div');
      bar.className = 'backbar';
      bar.innerHTML = '<a class="home-back" href="#/">⬅ Retour à l\'accueil</a>';
      app.prepend(bar);
    }
    async function route() {
      try {
        await refresh();
        const h = location.hash || '#/';
        if (h.startsWith('#/strategy/')) await strategyPage(decodeURIComponent(h.split('/')[2]));
        else if (h === '#/strategies') strategiesPage();
        else if (h === '#/ai') aiPage();
        else if (h === '#/ai-ask') aiAskPage();
        else if (h === '#/ai-strategies') aiStrategiesPage();
        else if (h === '#/predit') preditPage();
        else if (h === '#/after-loss') afterLossPage();
        else if (h === '#/announcements') await announcementsPage();
        else if (h === '#/diagnostics') await diagnosticsPage();
        else if (h === '#/database') await databasePage();
        else if (h === '#/formats') await formatsPage();
        else if (h === '#/settings') settingsPage();
        else if (h === '#/users') await usersPage();
        else if (h === '#/deploy') await deployPage();
        else home();
      } catch(e) { $('#app').innerHTML = `<div class="notice error">${esc(e.message)}</div>`; }
      injectBack();
      applyReadOnly();
      firstRouteDone = true;
    }
    new MutationObserver(() => injectBack()).observe($('#app'), { childList: true });
    window.addEventListener('hashchange', route); route(); setInterval(() => { if (!location.hash || location.hash === '#/') route(); }, 8000);
  </script>
</body>
</html>
